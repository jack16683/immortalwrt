name: Monthly custom ImmortalWrt x86_64

on:
  workflow_dispatch:
  push:
    branches:
      - custom-v25.12.1
    paths:
      - .github/workflows/custom-firmware.yml
  schedule:
    # 10:00 on the first day of every month in Asia/Shanghai (02:00 UTC).
    - cron: "0 2 1 * *"

permissions:
  contents: write

concurrency:
  group: monthly-custom-immortalwrt
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  IMMORTALWRT_BRANCH: master
  FORCE_UNSAFE_CONFIGURE: "1"

jobs:
  build:
    name: Build latest ImmortalWrt master x86_64 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
      - name: Checkout custom build configuration
        uses: actions/checkout@v7
        with:
          path: overlay
          fetch-depth: 0

      - name: Checkout latest ImmortalWrt master source
        shell: bash
        run: |
          set -euo pipefail
          git clone \
            --branch "$IMMORTALWRT_BRANCH" \
            --single-branch \
            https://github.com/immortalwrt/immortalwrt.git source
          echo "ImmortalWrt source: $(git -C source rev-parse HEAD)"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Restore downloads and compiler cache
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            source/dl
            source/.ccache
          key: iwrt-master-${{ runner.os }}-${{ hashFiles('overlay/config.seed', 'overlay/feeds.conf.append') }}-${{ github.run_number }}
          restore-keys: |
            iwrt-master-${{ runner.os }}-${{ hashFiles('overlay/config.seed', 'overlay/feeds.conf.append') }}-
            iwrt-master-${{ runner.os }}-

      - name: Prepare feeds and configuration
        working-directory: source
        env:
          CUSTOM_BUILD_OVERLAY_ROOT: ${{ github.workspace }}/overlay
          BUILD_META_DIR: build-metadata
        run: bash ../overlay/scripts/custom-build-prepare.sh

      - name: Configure ccache
        working-directory: source
        env:
          CCACHE_DIR: ${{ github.workspace }}/source/.ccache
        run: |
          ccache --max-size=5G
          ccache --zero-stats

      - name: Download source archives
        working-directory: source
        run: make download -j"$(nproc)"

      - name: Build firmware
        id: compile
        working-directory: source
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/source/.ccache
        run: |
          set -o pipefail
          if ! make -j"$(nproc)" 2>&1 | tee build.log; then
            echo 'Parallel build failed; retrying single-threaded with verbose output for diagnosis.' | tee -a build.log
            make -j1 V=s 2>&1 | tee -a build.log || true
            exit 1
          fi

      - name: Show ccache statistics
        if: always()
        working-directory: source
        env:
          CCACHE_DIR: ${{ github.workspace }}/source/.ccache
        run: ccache --show-stats || true

      - name: Save downloads and compiler cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            source/dl
            source/.ccache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Collect all x86_64 firmware and metadata
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          target_dir="source/bin/targets/x86/64"
          output_dir="release-assets"
          mkdir -p "$output_dir"

          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            case "$name" in
              immortalwrt-imagebuilder-*|immortalwrt-sdk-*|sha256sums) continue ;;
            esac
            ln "$file" "$output_dir/$name"
          done < <(find "$target_dir" -maxdepth 1 -type f -print0)
          cp -v source/build-metadata/* "$output_dir/"

          for format in '*.img.gz' '*.qcow2' '*.qcow2.gz' '*.vmdk' '*.vmdk.gz'; do
            if ! find "$output_dir" -maxdepth 1 -type f -name "$format" -print -quit | grep -q .; then
              echo "error: expected x86_64 image format was not produced: $format" >&2
              exit 1
            fi
          done
          (
            cd "$output_dir"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          find "$output_dir" -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ github.run_number }}
          path: |
            source/build.log
            source/build-metadata/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base_commit="$(git -C source rev-parse HEAD)"
          short_base="${base_commit:0:12}"
          tag="firmware-master-$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          cat > release-notes.md <<EOF
          Automated monthly custom ImmortalWrt x86_64 firmware built from the latest upstream master and current feeds.

          - Base branch: ImmortalWrt ${IMMORTALWRT_BRANCH}
          - Base commit: ${base_commit}
          - Base short SHA: ${short_base}
          - Build run: ${GITHUB_RUN_ID}
          - Built at: $(date '+%Y-%m-%d %H:%M:%S %Z')
          - Exact base and feed revisions: see source-revisions.tsv
          - Verify downloads with SHA256SUMS
          EOF
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ImmortalWrt master custom x86_64 $(date +%Y-%m-%d)" \
            --notes-file release-notes.md
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "BASE_COMMIT=$base_commit" >> "$GITHUB_ENV"

      - name: Record successful build activity
        if: success()
        working-directory: overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-history
          cat > build-history/latest.md <<EOF
          # Latest successful firmware build

          - Release: ${RELEASE_TAG}
          - Base branch: ImmortalWrt ${IMMORTALWRT_BRANCH}
          - Base commit: ${BASE_COMMIT}
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Beijing time: $(date '+%Y-%m-%d %H:%M:%S %Z')
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-history/latest.md
          git commit -m "build: record ${RELEASE_TAG}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
